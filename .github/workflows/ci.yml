name: CI

# 构建验证：PR、main 推送、以及被上游同步流程显式调用时运行。
# 不产出镜像，只回答一个问题——这份代码还能不能构建起来。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        # workflow_call 默认检出调用方的提交（main），验证同步分支必须显式传入
        description: "要验证的 ref；留空则用触发事件自身的提交"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # 与 Dockerfile 保持一致：web 用 bun，锁文件是 web/bun.lock
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      - name: Build
        working-directory: web
        run: bun run build

  agent:
    name: Canvas agent (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canvas-agent/package-lock.json

      - name: Install
        working-directory: canvas-agent
        run: npm ci

      - name: Test
        working-directory: canvas-agent
        run: npm test

      - name: Build
        working-directory: canvas-agent
        run: npm run build

  docker:
    name: Docker build (amd64, 不推送)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-buildx-action@v3

      # 只验证镜像能否构建成功，单架构即可；多架构留给发布流程
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
